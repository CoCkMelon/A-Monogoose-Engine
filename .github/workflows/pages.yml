name: Rebuild WASM site for GitHub Pages

# GitHub Pages serves /docs from this branch (legacy source). The site is
# three single-file Emscripten bundles compiled from the SAME C sources as
# desktop (web/build.sh) plus a ~70-line hand-written loader — no npm, no
# bundler. This job rebuilds docs/ whenever the C/web sources change and
# pushes the result back. Path filters prevent loops: the bot commit only
# touches docs/**, which is not a trigger path.

on:
  push:
    branches: [agent/ame-next-20260905-4ad0fd06]
    paths:
      - "src/**"
      - "include/**"
      - "generated/**"
      - "examples/**"
      - "external/**"
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: emscripten-core/emsdk-action@v4

      - name: build (emcc -> docs/games/*.js, single file each)
        run: sh web/build.sh

      - name: refresh docs/ when the build changed
        run: |
          touch docs/.nojekyll
          if git diff --quiet -- docs/; then
            echo "docs already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "chore(pages): rebuild wasm bundles (web/build.sh)"
          git push

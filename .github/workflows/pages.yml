name: Rebuild web companion for GitHub Pages

# GitHub Pages serves /docs from this branch (legacy source). The site is a
# Vite single-file build with the engine's wasm ports inlined, so this job
# rebuilds dist/ and refreshes docs/index.html whenever the web sources
# change. Path filters prevent loops: the bot commit only touches docs/**,
# which is not a trigger path.

on:
  push:
    branches: [agent/ame-next-20260905-4ad0fd06]
    paths:
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "src/**/*.css"
      - "src/wasm/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: build (vite -> dist/index.html, single file)
        run: npm run build

      - name: refresh docs/index.html when the build changed
        run: |
          cp dist/index.html docs/index.html
          touch docs/.nojekyll
          if git diff --quiet -- docs/; then
            echo "docs already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll
          git commit -m "chore(pages): rebuild web companion (docs/index.html)"
          git push

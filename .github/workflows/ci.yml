name: ci

# ame-next CI (build.txt): every job builds the engine's OWN code with
# warnings-as-errors; external/ is exempt. The Linux job also RUNS the
# tests headlessly (logic + golden render under llvmpipe/EGL surfaceless).
# Windows/macOS/web compile jobs below keep the platform claims honest;
# Linux remains the only job that runs the headless GL test suite.

on:
  push:
    # ame-next-trunk added 2026-11-21. It is the branch every pipeline stage
    # targets, and it had ZERO CI runs until PR #11: the trigger list never
    # named it, so the trunk tip was unverified between pull requests and the
    # first PR on this lineage (2026-11-20, the first run since 2026-09-09)
    # inherited two months of untested drift as seven red jobs.
    branches: [main, master, ame-next-trunk, agent/ame-next-20260905-4ad0fd06]
  pull_request:
  # On demand: run the matrix against a chosen ref - a baseline for a branch
  # that has none, or a re-run after a runner-image change.
  workflow_dispatch:

jobs:
  linux:
    name: linux (clang-19, C23, both dims, headless tests)
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: toolchain (clang-19 pinned for C23/#embed, build.txt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 lld-19 cmake ninja-build libegl1 \
            libgl1-mesa-dri libgles-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev libxtst-dev libfreetype-dev

      - name: SDL3 from source (pinned release; noble has no libsdl3-dev)
        run: |
          git clone --depth 1 --branch release-3.4.16 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3
          cmake -S /tmp/sdl3 -B /tmp/sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF
          cmake --build /tmp/sdl3/build
          sudo cmake --install /tmp/sdl3/build
          rm -rf /tmp/sdl3

      - name: configure + build (Debug, tests + examples + game)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-19 -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

      - name: game-side SDL boundary gate
        run: |
          if grep -RIn "SDL_" examples/ --include='*.c'; then
            echo "game code touches SDL; keep platform code in src/app_*"
            exit 1
          fi

      - name: ctest (logic + geometry + audio + text + sim + golden render)
        run: ctest --test-dir build --output-on-failure

      - name: headless game screenshot smoke (Stage 0 exit check)
        run: |
          cd build
          SDL_VIDEODRIVER=offscreen SDL_AUDIO_DRIVER=dummy \
          AME_SCREENSHOT=game_shot.png \
            timeout 60 ./examples/memory_game/memory_game
          test -s game_shot.png

      - name: headless biscuit shot (runtime OBJ level + rp_push_* + text)
        run: |
          cd build
          SDL_VIDEODRIVER=offscreen SDL_AUDIO_DRIVER=dummy \
          LIBGL_ALWAYS_SOFTWARE=1 AME_WINDOW_W=960 AME_WINDOW_H=540 \
          AME_SHOT_PPM=biscuit_shot.ppm AME_SHOT_FRAMES=40 AME_SHOT_NOFLIP=1 \
            timeout -s KILL 60 ./examples/biscuit/biscuit || true
          test -s biscuit_shot.ppm

      - name: release build (warnings-as-errors, -O3, LTO)
        run: |
          cmake -S . -B build-rel -G Ninja \
            -DCMAKE_C_COMPILER=clang-19 -DCMAKE_BUILD_TYPE=Release \
            -DAME_ENABLE_ASAN=OFF
          cmake --build build-rel

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            build/game_shot.png
            build/render_golden.png
            build/biscuit_shot.ppm
          if-no-files-found: warn

  android-cross:
    name: android (NDK cross, build-only coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: NDK r27c
        run: |
          curl -sL -o "$RUNNER_TEMP/ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/ndk.zip"
      - name: SDL3 for Android (pinned release, x86_64)
        run: |
          git clone --depth 1 --branch release-3.4.16 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3
          # Build dir NESTED under the source dir, like the three recipes that
          # already work (the linux, asan and tsan jobs all use /tmp/sdl3/build).
          # SDL3 passes its GENERATED include-revision/SDL3/SDL_revision.h to
          # sdl_source_group(), which requires every file to sit under the source
          # prefix; a sibling build dir fails configure with
          #   source_group "/tmp/sdl3" is not a prefix of file
          #   "/tmp/sdl3-android/include-revision/SDL3/SDL_revision.h"
          # The install prefix stays where the cross build below expects it.
          cmake -S /tmp/sdl3 -B /tmp/sdl3/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$RUNNER_TEMP/android-ndk-r27c/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-android-prefix -DSDL_TESTS=OFF
          cmake --build /tmp/sdl3/build
          cmake --install /tmp/sdl3/build
      # build-only: the SAME C23 sources must COMPILE+LINK for android
      # (handoff NEXT ACTIONS 3). Games are SHARED libs exporting
      # SDL_main (activity model); tests/benches stay host-side.
      - name: cross configure + build (engine + games)
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$RUNNER_TEMP/android-ndk-r27c/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-26 \
            -DCMAKE_PREFIX_PATH=/tmp/sdl3-android-prefix \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_BUILD_TYPE=Release \
            -DAME_BUILD_TESTS=OFF -DAME_BUILD_BENCHES=OFF
          cmake --build build-android
      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-cross-libs
          path: |
            build-android/examples/*/lib*.so
          if-no-files-found: warn

  windows-cross:
    name: windows (MinGW-w64 cross, build-only coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: mingw toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 cmake ninja-build
      - name: SDL3 MinGW dev tarball (pinned; same release as linux job)
        run: |
          curl -sL -o /tmp/sdl3-mingw.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-devel-3.4.16-mingw.tar.gz
          tar -xf /tmp/sdl3-mingw.tar.gz -C /tmp
      # build-only: the SAME C23 sources must COMPILE+LINK for win64
      # (handoff NEXT ACTIONS 1). Tests/benches stay host-side; the
      # committed generated arrays feed ame_font (tools/ gates itself
      # off under CMAKE_CROSSCOMPILING - host bakers cannot run).
      - name: cross configure + build (engine + games)
        run: |
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw-w64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/SDL3-3.4.16/x86_64-w64-mingw32 \
            -DAME_BUILD_TESTS=OFF -DAME_BUILD_BENCHES=OFF
          cmake --build build-win
      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cross-exes
          path: |
            build-win/examples/*/*.exe
          if-no-files-found: warn

  asan:
    name: linux (ASan/UBSan, hot-loop heap check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 lld-19 cmake ninja-build libegl1 \
            libgl1-mesa-dri libgles-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev libxtst-dev libfreetype-dev libclang-rt-19-dev
      - name: SDL3 from source (pinned release; noble has no libsdl3-dev)
        run: |
          git clone --depth 1 --branch release-3.4.16 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3
          cmake -S /tmp/sdl3 -B /tmp/sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF
          cmake --build /tmp/sdl3/build
          sudo cmake --install /tmp/sdl3/build
          rm -rf /tmp/sdl3

      - name: build + run tests under sanitizers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_BUILD_TYPE=Debug -DAME_ENABLE_ASAN=ON
          cmake --build build
          # LeakSanitizer stays ON. The suppression file names only
          # uninstrumented driver libraries: on this runner's Mesa (26.0.8)
          # test_render_2d prints "all 23 checks passed" and then LSan reports
          # leaks whose every frame is inside libEGL_mesa / libgallium. The same
          # sources on Mesa 25.0.7 report zero leaks with detection enabled, so
          # this is runner-environment specific. Suppressing driver frames keeps
          # engine leaks visible, which ASAN_OPTIONS=detect_leaks=0 would not.
          LSAN_OPTIONS=suppressions=$GITHUB_WORKSPACE/tools/lsan_suppressions.txt \
            ctest --test-dir build --output-on-failure

  package:
    name: linux (package stage-0 unit, deploy.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libegl1 libgl1-mesa-dri libgles-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev libxtst-dev libfyaml-dev libfreetype-dev libassimp-dev
      - name: SDL3 from source (pinned release; noble has no libsdl3-dev)
        run: |
          git clone --depth 1 --branch release-3.4.16 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3
          cmake -S /tmp/sdl3 -B /tmp/sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF
          cmake --build /tmp/sdl3/build
          sudo cmake --install /tmp/sdl3/build
          rm -rf /tmp/sdl3

      - name: pack (release; static SDL3 where available, else $ORIGIN bundle)
        run: tools/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ame-next-stage0-linux-amd64
          path: dist/ame-next-stage0-linux-amd64.tar.gz

  tsan:
    name: linux (TSan, snapshot seqlock + pool concurrency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 lld-19 cmake ninja-build libegl1 \
            libgl1-mesa-dri libgles-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev libxtst-dev libfreetype-dev libclang-rt-19-dev
      - name: SDL3 from source (pinned release; noble has no libsdl3-dev)
        run: |
          git clone --depth 1 --branch release-3.4.16 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3
          cmake -S /tmp/sdl3 -B /tmp/sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF
          cmake --build /tmp/sdl3/build
          sudo cmake --install /tmp/sdl3/build
          rm -rf /tmp/sdl3

      - name: full suite under TSan (driver frames suppressed)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g -O1"
          cmake --build build
          # WIDENED from "test_snap + test_pool only". That pair is exactly the
          # two suites that never touch the device registry, so the one real
          # engine race TSan can find here - src/input.c registry_add's
          # update-in-place path versus in_device_info, issue #12 - was never
          # exercised by this job.
          # test_input stays EXCLUDED until #12 is fixed (stage S1C, scheduled
          # next). The exclusion is named rather than silent so it cannot
          # outlive its reason; when #12 lands, drop -E and the suite joins.
          # The suppression file covers libgallium frames only: test_render
          # trips a flaky Mesa teardown race (pthread_mutex_destroy on the main
          # thread versus a gallium worker's atomic pthread_mutex_lock),
          # measured over 20 runs per tree at 1/20 on 417cbd4 and 2/20 on its
          # parent 2850fd6 - the same low rate on both, with tests/test_render.c
          # byte-identical between them, so it is a driver artifact and not
          # engine code.
          TSAN_OPTIONS=suppressions=$GITHUB_WORKSPACE/tools/tsan_suppressions.txt \
            ctest --test-dir build --output-on-failure -E '^input$'

  clean-smoke:
    name: "linux (CLEAN machine: packaged unit smoke)"
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ame-next-stage0-linux-amd64
          path: dist
      # runtime packages ONLY - no -dev, no toolchain: this is the
      # "runs on a machine with no dev environment" check (deploy.txt)
      - name: runtime deps only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dri libgles2
      - name: smoke (unpack, dep audit, headless PNG, seed replay)
        run: tools/smoke.sh dist/ame-next-stage0-linux-amd64.tar.gz

  lean:
    name: "lean 4 (kernel-checked model: no sorry, axioms logged)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: elan + toolchain (pinned by lean-toolchain)
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build (all theorems kernel-checked)
        run: lake build
        working-directory: lean
      - name: axiom disclosure (must show only native_decide deps)
        run: |
          printf 'import Ame.Shader\nimport Ame.Text\n#print axioms Ame.Shader.lookAt_vec\n#print axioms Ame.Text.eol_caret_eq_width\n' > /tmp/ax.lean
          lake env lean /tmp/ax.lean
        working-directory: lean

  windows:
    name: windows (clang C23 compile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: toolchain
        shell: pwsh
        run: choco install llvm ninja -y --no-progress
      - name: SDL3 from source
        shell: pwsh
        run: |
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git $env:RUNNER_TEMP/sdl3
          # nested build dir: see the android-cross job for why a sibling dir fails
          cmake -S $env:RUNNER_TEMP/sdl3 -B $env:RUNNER_TEMP/sdl3/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build $env:RUNNER_TEMP/sdl3/build
          cmake --install $env:RUNNER_TEMP/sdl3/build --prefix $env:RUNNER_TEMP/sdl-prefix
      - name: configure + compile engine
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/sdl-prefix `
            -DAME_BUILD_EXAMPLES=OFF -DAME_BUILD_TESTS=OFF `
            -DAME_BUILD_BENCHES=OFF -DAME_BUILD_ASYNCINPUT_GAME=OFF `
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

  macos:
    name: macOS (Clang C23 compile)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: toolchain
        run: brew install cmake ninja
      - name: SDL3 from source
        run: |
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/sdl3"
          cmake -S "$RUNNER_TEMP/sdl3" -B "$RUNNER_TEMP/sdl3-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl-prefix"
          cmake --build "$RUNNER_TEMP/sdl3-build"
          cmake --install "$RUNNER_TEMP/sdl3-build"
      - name: configure + compile engine
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl-prefix" \
            -DAME_BUILD_EXAMPLES=OFF -DAME_BUILD_TESTS=OFF \
            -DAME_BUILD_BENCHES=OFF -DAME_BUILD_ASYNCINPUT_GAME=OFF \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

  web:
    name: web (Emscripten C23 compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: emscripten-core/setup-emsdk@v16
      - name: compile bundles
        run: sh web/build.sh
      - name: verify JavaScript bundles
        run: |
          for f in docs/games/*.js; do node --check "$f"; done
          test -s docs/index.html
  drift:
    name: spec/code drift (public header -> docs/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: drift gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi
          tools/ci_drift_check.sh "$BASE" "$HEAD"
  android-apk:
    name: android apk (multi-ABI packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # the heavy inputs are content-addressed: same NDK/SDL/SDK/gradle
      # versions -> cache hit, so a push only rebuilds OUR code
      - name: cache NDK + SDL prefixes
        uses: actions/cache@v4
        with:
          path: |
            ndk/android-ndk-r27c
            sdl-prefixes
          key: android-apk-ndk-r27c-sdl-3.4.16-v1
      - name: fetch NDK r27c
        run: |
          if [ ! -d ndk/android-ndk-r27c ]; then
            mkdir -p ndk
            curl -sL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
            unzip -q ndk.zip -d ndk && rm ndk.zip
          fi
      - name: fetch SDL source (pinned tag)
        run: |
          if [ ! -d SDL-release-3.4.16 ]; then
            curl -sL -o sdl.tgz https://github.com/libsdl-org/SDL/archive/refs/tags/release-3.4.16.tar.gz
            tar xzf sdl.tgz && rm sdl.tgz
          fi
      - name: cache android sdk
        uses: actions/cache@v4
        with:
          path: android-sdk
          key: android-sdk-33-33.0.2-v1
      - name: android sdk (platform 33 + build-tools)
        run: |
          if [ ! -d android-sdk/cmdline-tools/latest ]; then
            curl -sL -o c.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
            unzip -q c.zip
            mkdir -p android-sdk/cmdline-tools
            mv cmdline-tools android-sdk/cmdline-tools/latest && rm c.zip
          fi
          yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" > /dev/null
      - name: cache gradle
        uses: actions/cache@v4
        with:
          path: gradle-7.5
          key: gradle-7.5-v1
      - name: fetch gradle 7.5 (JDK11-era AGP 7.4 line)
        run: |
          if [ ! -x gradle-7.5/bin/gradle ]; then
            curl -sL -o g.zip https://services.gradle.org/distributions/gradle-7.5-bin.zip
            unzip -q g.zip && rm g.zip
          fi
      - name: native libs for all APK ABIs
        run: |
          AME_ANDROID_BUILD_ROOT="$RUNNER_TEMP/ame-android" \
          AME_SDL_PREFIX_ROOT="$GITHUB_WORKSPACE/sdl-prefixes" \
          tools/android_apk_libs.sh \
            "$GITHUB_WORKSPACE/ndk/android-ndk-r27c" \
            "$GITHUB_WORKSPACE/SDL-release-3.4.16"
      - name: assemble debug apks (per-ABI splits + universal)
        run: |
          cd android
          echo "sdk.dir=$GITHUB_WORKSPACE/android-sdk" > local.properties
          ../gradle-7.5/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk

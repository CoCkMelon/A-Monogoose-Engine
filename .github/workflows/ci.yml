name: ci

# ame-next CI (build.txt): every job builds the engine's OWN code with
# warnings-as-errors; external/ is exempt. The Linux job also RUNS the
# tests headlessly (logic + golden render under llvmpipe/EGL surfaceless).
# Windows/macOS/web compile jobs below keep the platform claims honest;
# Linux remains the only job that runs the headless GL test suite.

on:
  push:
    branches: [main, master, agent/ame-next-20260905-4ad0fd06]
  pull_request:

jobs:
  linux:
    name: linux (clang-19, C23, both dims, headless tests)
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: toolchain (clang-19 pinned for C23/#embed, build.txt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 lld-19 cmake ninja-build libegl1 \
            libgl1-mesa-dri libgles-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev libxtst-dev libfreetype-dev

      - name: SDL3 from source (pinned release; noble has no libsdl3-dev)
        run: |
          git clone --depth 1 --branch release-3.4.16 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3
          cmake -S /tmp/sdl3 -B /tmp/sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF
          cmake --build /tmp/sdl3/build
          sudo cmake --install /tmp/sdl3/build
          rm -rf /tmp/sdl3

      - name: configure + build (Debug, tests + examples + game)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-19 -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

      - name: game-side SDL boundary gate
        run: |
          if grep -RIn "SDL_" examples/ --include='*.c'; then
            echo "game code touches SDL; keep platform code in src/app_*"
            exit 1
          fi

      - name: ctest (logic + geometry + audio + text + sim + golden render)
        run: ctest --test-dir build --output-on-failure

      - name: headless game screenshot smoke (Stage 0 exit check)
        run: |
          cd build
          SDL_VIDEODRIVER=offscreen SDL_AUDIO_DRIVER=dummy \
          AME_SCREENSHOT=game_shot.png \
            timeout 60 ./examples/memory_game/memory_game
          test -s game_shot.png

      - name: headless biscuit shot (runtime OBJ level + rp_push_* + text)
        run: |
          cd build
          SDL_VIDEODRIVER=offscreen SDL_AUDIO_DRIVER=dummy \
          LIBGL_ALWAYS_SOFTWARE=1 AME_WINDOW_W=960 AME_WINDOW_H=540 \
          AME_SHOT_PPM=biscuit_shot.ppm AME_SHOT_FRAMES=40 AME_SHOT_NOFLIP=1 \
            timeout -s KILL 60 ./examples/biscuit/biscuit || true
          test -s biscuit_shot.ppm

      - name: release build (warnings-as-errors, -O3, LTO)
        run: |
          cmake -S . -B build-rel -G Ninja \
            -DCMAKE_C_COMPILER=clang-19 -DCMAKE_BUILD_TYPE=Release \
            -DAME_ENABLE_ASAN=OFF
          cmake --build build-rel

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            build/game_shot.png
            build/render_golden.png
            build/biscuit_shot.ppm
          if-no-files-found: warn

  windows-cross:
    name: windows (MinGW-w64 cross, build-only coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: mingw toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 cmake ninja-build
      - name: SDL3 MinGW dev tarball (pinned; same release as linux job)
        run: |
          curl -sL -o /tmp/sdl3-mingw.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-devel-3.4.16-mingw.tar.gz
          tar -xf /tmp/sdl3-mingw.tar.gz -C /tmp
      # build-only: the SAME C23 sources must COMPILE+LINK for win64
      # (handoff NEXT ACTIONS 1). Tests/benches stay host-side; the
      # committed generated arrays feed ame_font (tools/ gates itself
      # off under CMAKE_CROSSCOMPILING - host bakers cannot run).
      - name: cross configure + build (engine + games)
        run: |
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw-w64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/SDL3-3.4.16/x86_64-w64-mingw32 \
            -DAME_BUILD_TESTS=OFF -DAME_BUILD_BENCHES=OFF
          cmake --build build-win
      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cross-exes
          path: |
            build-win/examples/*/*.exe
          if-no-files-found: warn

  asan:
    name: linux (ASan/UBSan, hot-loop heap check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 lld-19 cmake ninja-build libegl1 \
            libgl1-mesa-dri libgles-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev libxtst-dev libfreetype-dev libclang-rt-19-dev
      - name: SDL3 from source (pinned release; noble has no libsdl3-dev)
        run: |
          git clone --depth 1 --branch release-3.4.16 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3
          cmake -S /tmp/sdl3 -B /tmp/sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF
          cmake --build /tmp/sdl3/build
          sudo cmake --install /tmp/sdl3/build
          rm -rf /tmp/sdl3

      - name: build + run tests under sanitizers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_BUILD_TYPE=Debug -DAME_ENABLE_ASAN=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

  package:
    name: linux (package stage-0 unit, deploy.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libegl1 libgl1-mesa-dri libgles-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev libxtst-dev libfyaml-dev libfreetype-dev libassimp-dev
      - name: SDL3 from source (pinned release; noble has no libsdl3-dev)
        run: |
          git clone --depth 1 --branch release-3.4.16 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3
          cmake -S /tmp/sdl3 -B /tmp/sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF
          cmake --build /tmp/sdl3/build
          sudo cmake --install /tmp/sdl3/build
          rm -rf /tmp/sdl3

      - name: pack (release; static SDL3 where available, else $ORIGIN bundle)
        run: tools/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ame-next-stage0-linux-amd64
          path: dist/ame-next-stage0-linux-amd64.tar.gz

  tsan:
    name: linux (TSan, snapshot seqlock + pool concurrency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 lld-19 cmake ninja-build libegl1 \
            libgl1-mesa-dri libgles-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev libxtst-dev libfreetype-dev libclang-rt-19-dev
      - name: SDL3 from source (pinned release; noble has no libsdl3-dev)
        run: |
          git clone --depth 1 --branch release-3.4.16 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3
          cmake -S /tmp/sdl3 -B /tmp/sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF
          cmake --build /tmp/sdl3/build
          sudo cmake --install /tmp/sdl3/build
          rm -rf /tmp/sdl3

      - name: test_snap + test_pool under TSan
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g -O1"
          cmake --build build --target test_snap test_pool
          ./build/tests/test_snap
          ./build/tests/test_pool

  clean-smoke:
    name: "linux (CLEAN machine: packaged unit smoke)"
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ame-next-stage0-linux-amd64
          path: dist
      # runtime packages ONLY - no -dev, no toolchain: this is the
      # "runs on a machine with no dev environment" check (deploy.txt)
      - name: runtime deps only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dri libgles2
      - name: smoke (unpack, dep audit, headless PNG, seed replay)
        run: tools/smoke.sh dist/ame-next-stage0-linux-amd64.tar.gz

  lean:
    name: "lean 4 (kernel-checked model: no sorry, axioms logged)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: elan + toolchain (pinned by lean-toolchain)
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build (all theorems kernel-checked)
        run: lake build
        working-directory: lean
      - name: axiom disclosure (must show only native_decide deps)
        run: |
          printf 'import Ame.Shader\nimport Ame.Text\n#print axioms Ame.Shader.lookAt_vec\n#print axioms Ame.Text.eol_caret_eq_width\n' > /tmp/ax.lean
          lake env lean /tmp/ax.lean
        working-directory: lean

  windows:
    name: windows (clang C23 compile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: toolchain
        shell: pwsh
        run: choco install llvm ninja -y --no-progress
      - name: SDL3 from source
        shell: pwsh
        run: |
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git $env:RUNNER_TEMP/sdl3
          cmake -S $env:RUNNER_TEMP/sdl3 -B $env:RUNNER_TEMP/sdl3-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build $env:RUNNER_TEMP/sdl3-build
          cmake --install $env:RUNNER_TEMP/sdl3-build --prefix $env:RUNNER_TEMP/sdl-prefix
      - name: configure + compile engine
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/sdl-prefix `
            -DAME_BUILD_EXAMPLES=OFF -DAME_BUILD_TESTS=OFF `
            -DAME_BUILD_BENCHES=OFF -DAME_BUILD_ASYNCINPUT_GAME=OFF `
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

  macos:
    name: macOS (Clang C23 compile)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: toolchain
        run: brew install cmake ninja
      - name: SDL3 from source
        run: |
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/sdl3"
          cmake -S "$RUNNER_TEMP/sdl3" -B "$RUNNER_TEMP/sdl3-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl-prefix"
          cmake --build "$RUNNER_TEMP/sdl3-build"
          cmake --install "$RUNNER_TEMP/sdl3-build"
      - name: configure + compile engine
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl-prefix" \
            -DAME_BUILD_EXAMPLES=OFF -DAME_BUILD_TESTS=OFF \
            -DAME_BUILD_BENCHES=OFF -DAME_BUILD_ASYNCINPUT_GAME=OFF \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

  web:
    name: web (Emscripten C23 compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: emscripten-core/setup-emsdk@v16
      - name: compile bundles
        run: sh web/build.sh
      - name: verify JavaScript bundles
        run: |
          for f in docs/games/*.js; do node --check "$f"; done
          test -s docs/index.html
